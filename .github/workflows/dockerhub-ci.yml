name: Docker Hub

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Login a Docker Hub (Actualizado a v3)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_ANGEL }}
          password: ${{ secrets.DOCKERHUB_TOKEN_ANGEL }}

      # 3. Build y Push con tags latest y SHA
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME_ANGEL }}
        with:
          context: .
          file: ./dockerfile-angel/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/pipeline-t02-be:latest
            ${{ env.DOCKER_USER }}/pipeline-t02-be:${{ github.sha }}